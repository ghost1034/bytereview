# Serves the SPA and proxies /api to the backend service. TLS terminates upstream (load balancer / ingress).
upstream api { server api:8000; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 10m;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz { include /etc/nginx/snippets/security-headers.conf; default_type text/plain; return 200 'ok'; }

  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;
    proxy_buffering off;  # streaming CSV exports
  }

  # Hashed assets: cache forever. index.html: never.
  location /assets/ { include /etc/nginx/snippets/security-headers.conf; try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable" always; }
  location / { include /etc/nginx/snippets/security-headers.conf; try_files $uri /index.html; add_header Cache-Control "no-store" always; }
}
