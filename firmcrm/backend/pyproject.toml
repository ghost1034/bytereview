[project]
name = "firmcrm"
version = "0.3.1"
description = "CRM for accounting, law, and professional services firms: leads, accounts, contacts, opportunities, conflict checks, origination, referrals, campaigns, reporting."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-json-logger>=2.0",
    "redis>=5.0",
    "pydantic>=2.9",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "PyJWT>=2.9",
    "bcrypt>=4.0,<4.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "fakeredis>=2.23"]
observability = ["sentry-sdk[fastapi]>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::sqlalchemy.exc.SAWarning"]
addopts = "--cov=app --cov-report=term-missing:skip-covered --cov-fail-under=85 -q"

[tool.coverage.run]
omit = ["app/seed.py", "app/core/migrate.py"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B904", "E501", "E741", "UP046"]
