name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests on SQLite + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests && ruff format --check app tests || true
      - name: Migrations match models (SQLite)
        run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: sqlite:///./ci.db
      - name: Tests (SQLite, with coverage floor)
        run: pytest
        env:
          DATABASE_URL: sqlite:///./test_ci.db
      - name: Migrations match models (Postgres)
        run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: postgresql+psycopg://crm:crm@localhost:5432/crm
      - name: Tests (Postgres)
        run: pytest --no-cov
        env:
          DATABASE_URL: postgresql+psycopg://crm:crm@localhost:5432/crm
      - name: Enum sync + production config guards are part of the suite
        run: pytest --no-cov -q tests/test_config.py tests/test_validation_archive.py::test_frontend_enums_match_backend
        env:
          DATABASE_URL: sqlite:///./test_ci2.db

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: firmcrm-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: firmcrm-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke:
    name: Compose smoke (migrate, seed, ready, login)
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - uses: actions/checkout@v4
      - name: Write .env
        run: |
          cat > .env <<'ENV'
          APP_ENV=production
          POSTGRES_PASSWORD=ci-compose-password-0123456789
          SECRET_KEY=ci-compose-secret-key-that-is-definitely-longer-than-32-chars
          CORS_ORIGINS=https://crm.example.com
          WEB_PORT=8080
          LOGIN_RATE_LIMIT_PER_MINUTE=1000
          ENV
      - run: docker compose up --build -d
      - name: Wait for readiness
        run: for i in $(seq 1 60); do curl -fsS localhost:8080/api/ready && exit 0; sleep 2; done; docker compose logs api; exit 1
      - run: docker compose --profile seed run --rm seed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Black-box e2e suite against the compose stack
        run: pip install pytest httpx && E2E_BASE_URL=http://localhost:8080 pytest backend/tests_e2e --no-cov -q -p no:cacheprovider
      - if: always()
        run: docker compose down -v
