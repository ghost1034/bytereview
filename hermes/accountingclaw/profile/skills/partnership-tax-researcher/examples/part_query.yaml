matter_id: PART-754-2024
issue: Can the partnership make a Section 754 election following a partner buyout?
facts:
  - Operating partnership with 4 partners; Partner C exits via redemption in 2024.
  - Partnership has appreciated real property; basis step-up desired.
  - Partnership agreement silent on 754 elections.
research_questions:
  - What are the requirements and timing for a §754 election under IRC §754 and Reg. §1.754-1?
  - Does the redemption trigger a §743(b) adjustment for remaining partners?
  - What are the filing and disclosure requirements on Form 1065?
preliminary_conclusion: §754 election may be available if timely filed — basis adjustment analysis required.
