name: accountingclaw
display_name: AccountingClaw
description: CPAAutomation.ai accounting agent profile with bundled accounting skills
version: 0.1.0
publisher: CPAAutomation.ai
license: Commercial

required_environment_variables:
  - name: CPAA_BUNDLE_SECRET
    prompt: CPAAutomation.ai bundle decryption secret
    required_for: decrypting bundled AccountingClaw skills
  - name: OPENROUTER_API_KEY
    prompt: OpenRouter API key
    required_for: Hermes model access with the default OpenRouter provider

# Each skills/<skill>/ entry bundles that skill's SKILL.md plus its scripts/ and
# examples/ (the skill scripts produce XLSX/DOCX/CSV workpapers from the samples).
contents:
  - SOUL.md
  - config.yaml
  - skills/ap-exception-reviewer/
  - skills/audit-evidence-packager/
  - skills/audit-pbc-coordinator/
  - skills/balance-sheet-reconciler/
  - skills/close-orchestration-dashboard/
  - skills/corporate-tax-researcher/
  - skills/debt-equity-reviewer/
  - skills/disclosure-footnote-assistant/
  - skills/expense-policy-reviewer/
  - skills/fixed-asset-lifecycle-manager/
  - skills/flux-variance-analyst/
  - skills/individual-tax-researcher/
  - skills/intercompany-elimination-bot/
  - skills/journal-entry-assistant/
  - skills/lease-842-assistant/
  - skills/partnership-tax-researcher/
  - skills/payroll-gl-reconciler/
  - skills/reserves-estimator/
  - skills/rev-rec-606-analyst/
  - skills/sales-tax-researcher/
  - skills/sox-control-reviewer/
  - skills/tax-provision-calculator/
  - skills/tech-accounting-memo/
  - skills/transfer-pricing-analyst/
